[package]
name = "dala_holder"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "dala_holder"
path = "src/main.rs"

[dependencies]
notify = "8"
portable-pty = "0.9"
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
alacritty_terminal = "0.26"

[target.'cfg(windows)'.dependencies]
sysinfo = { version = "0.38.4", default-features = false, features = ["system"] }
winapi = { version = "0.3.9", features = ["wincon"] }

[profile.release]
strip = true
